services:
  # Web Service
  - type: web
    name: host-helper-clean
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: host-helper-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://host-helper-clean.onrender.com
    healthCheckPath: /api/health

databases:
  # PostgreSQL Database
  - name: host-helper-db
    plan: starter
    databaseName: hosthelper
    user: hosthelper_user
